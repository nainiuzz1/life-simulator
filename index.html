<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人生模拟器 - 简化版</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Microsoft YaHei', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        #game-box {
            width: 100%;
            max-width: 480px;
            background: rgba(255,255,255,0.96);
            border-radius: 20px;
            padding: 28px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 { text-align: center; color: #333; margin-bottom: 4px; font-size: 26px; }
        .subtitle { text-align: center; color: #888; font-size: 13px; margin-bottom: 20px; }

        #age-display {
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 16px;
        }

        #event-card {
            background: #f8f9fa;
            border-radius: 14px;
            padding: 22px;
            text-align: center;
            font-size: 16px;
            line-height: 1.7;
            color: #333;
            margin-bottom: 14px;
            border-left: 5px solid #667eea;
            min-height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #result-card {
            display: none;
            background: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 10px;
            padding: 12px;
            text-align: center;
            font-size: 14px;
            color: #856404;
            margin-bottom: 14px;
        }

        #choices-box {
            display: none;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 16px;
        }
        .choice-btn {
            padding: 14px 18px;
            border: 2px solid #667eea;
            background: #fff;
            color: #667eea;
            border-radius: 12px;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
            font-weight: 500;
        }
        .choice-btn:hover {
            background: #667eea;
            color: #fff;
            transform: translateY(-2px);
        }
        .choice-btn:active { transform: translateY(0); }

        #attrs-box { margin-bottom: 18px; }
        .attr-row {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            gap: 10px;
        }
        .attr-label { width: 40px; font-size: 13px; color: #555; font-weight: 500; }
        .attr-bar-bg {
            flex: 1;
            height: 10px;
            background: #e9ecef;
            border-radius: 5px;
            overflow: hidden;
        }
        .attr-bar-fill {
            height: 100%;
            border-radius: 5px;
            transition: width 0.5s ease;
        }
        .attr-value { width: 36px; text-align: right; font-size: 13px; font-weight: bold; color: #444; }

        .btn {
            width: 100%;
            padding: 14px;
            font-size: 17px;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-primary:hover { opacity: 0.92; transform: translateY(-2px); }
        .btn-primary:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        #game-page { display: block; }
        #ending-page { display: none; text-align: center; padding: 20px 0; }
        .ending-icon { font-size: 48px; margin-bottom: 10px; }
        .ending-title { font-size: 26px; font-weight: bold; color: #e74c3c; margin-bottom: 10px; }
        .ending-desc { font-size: 15px; color: #555; margin-bottom: 24px; line-height: 1.7; }
        .ending-score { font-size: 14px; color: #777; margin-bottom: 6px; }

        @media (max-width: 480px) {
            #game-box { padding: 20px; border-radius: 16px; }
            h1 { font-size: 22px; }
        }
    </style>
</head>
<body>

<div id="game-box">
    <h1>🎮 人生模拟器</h1>
    <div class="subtitle">简化版 · 点击选项，过完一生</div>

    <div id="game-page">
        <div id="age-display">年龄: 0 岁</div>
        <div id="event-card">你出生了，伴随着一声啼哭来到这个世界。</div>
        <div id="result-card"></div>
        <div id="choices-box"></div>

        <div id="attrs-box">
            <div class="attr-row">
                <span class="attr-label">智力</span>
                <div class="attr-bar-bg"><div class="attr-bar-fill" id="bar-int" style="width:50%;background:#3498db"></div></div>
                <span class="attr-value" id="val-int">50</span>
            </div>
            <div class="attr-row">
                <span class="attr-label">体质</span>
                <div class="attr-bar-bg"><div class="attr-bar-fill" id="bar-str" style="width:50%;background:#2ecc71"></div></div>
                <span class="attr-value" id="val-str">50</span>
            </div>
            <div class="attr-row">
                <span class="attr-label">财富</span>
                <div class="attr-bar-bg"><div class="attr-bar-fill" id="bar-mny" style="width:50%;background:#f39c12"></div></div>
                <span class="attr-value" id="val-mny">50</span>
            </div>
            <div class="attr-row">
                <span class="attr-label">快乐</span>
                <div class="attr-bar-bg"><div class="attr-bar-fill" id="bar-hap" style="width:50%;background:#e74c3c"></div></div>
                <span class="attr-value" id="val-hap">50</span>
            </div>
        </div>

        <button id="next-btn" class="btn btn-primary" onclick="nextYear()">下一年</button>
    </div>

    <div id="ending-page">
        <div class="ending-icon" id="ending-icon">🏁</div>
        <div class="ending-title" id="ending-title">人生落幕</div>
        <div class="ending-desc" id="ending-desc"></div>
        <div id="ending-stats"></div>
        <button class="btn btn-primary" onclick="resetGame()" style="margin-top:10px">重新开始</button>
    </div>
</div>

<script>
    let player = { age: 0, alive: true, int: 50, str: 50, mny: 50, hap: 50, waitingChoice: false };

    const events = [
        { age: 0, text: "你出生了，伴随着一声啼哭来到这个世界。" },
        { age: 6, text: "你上小学了，老师夸你聪明伶俐。", effect: { int: 3 } },
        { age: 12, text: "班上调皮的同学想抢你的午饭钱...", choices: [
            { text: "🛡️ 反抗（可能受伤）", effect: { str: 8, hap: -5 }, result: "你虽然挨了一拳，但保住了尊严，身体也更结实了。" },
            { text: "🏃 告诉老师", effect: { int: 5, hap: 3 }, result: "老师批评了那个同学，你安心吃了午饭。" }
        ]},
        { age: 15, text: "中考在即，你面临人生第一次重要选择...", choices: [
            { text: "📚 拼命学习", effect: { int: 12, str: -5, hap: -5 }, result: "你考上了重点高中，但熬夜太多，身体累坏了。" },
            { text: "🎮 顺其自然", effect: { int: -5, hap: 10 }, result: "你轻松度过了初中，但成绩一般，去了普通高中。" }
        ]},
        { age: 18, text: "高考结束，填报志愿时家人希望你学师范...", choices: [
            { text: "💻 坚持计算机", effect: { int: 8, mny: 5, hap: 5 }, result: "你选择了热爱的专业，虽然辛苦但很充实。" },
            { text: "📖 听从家人学师范", effect: { int: 3, hap: -5, mny: 2 }, result: "你听从了安排，但心里总有些不甘。" }
        ]},
        { age: 22, text: "大学毕业，你拿到了两份 offer...", choices: [
            { text: "🏢 去大厂卷", effect: { mny: 15, hap: -5, str: -5 }, result: "高薪但 996，头发开始变少了。" },
            { text: "🏛️ 考公务员", effect: { mny: 5, hap: 5, str: 5 }, result: "工作稳定，朝九晚五，但薪资一般。" }
        ]},
        { age: 28, text: "家里安排你去相亲，对面坐着一位看起来很温柔的姑娘...", choices: [
            { text: "😊 热情主动，聊聊爱好", effect: { hap: 12, mny: -3 }, result: "你们聊得很开心，对方愿意继续交往。" },
            { text: "😶 低头玩手机，敷衍了事", effect: { hap: -8 }, result: "场面一度很尴尬，对方礼貌地结束了见面。" }
        ]},
        { age: 30, text: "你的孩子出生了，你成为了父亲/母亲。", effect: { hap: 5, mny: -5 } },
        { age: 35, text: "公司效益不好，老板暗示可能要裁员...", choices: [
            { text: "🔥 主动跳槽，寻找新机会", effect: { mny: 12, hap: 5, int: 5 }, result: "你找到了更好的平台，薪资还涨了。" },
            { text: "😰 忍气吞声，继续熬着", effect: { mny: -5, hap: -10, str: -5 }, result: "你每天活在焦虑中，身心俱疲。" }
        ]},
        { age: 45, text: "手里有点积蓄，朋友推荐投资机会...", choices: [
            { text: "🏠 买房投资", effect: { mny: 15 }, result: "几年后房价大涨，你暗自庆幸。" },
            { text: "📈 全仓炒股", effect: { mny: -15, hap: -8 }, result: "股市暴跌，你的积蓄缩水大半。" }
        ]},
        { age: 60, text: "你退休了，开始享受晚年生活。", effect: { hap: 8, str: -5 } },
        { age: 75, text: "孙子经常来看你，你觉得很满足。", effect: { hap: 5 } },
        { age: 85, text: "你在一个阳光明媚的早晨，在睡梦中安详离世。", death: true }
    ];

    const randomEvents = [
        "今年风平浪静，生活平淡如水。",
        "周末和朋友聚餐，心情不错。",
        "工作上有小突破，得到了表扬。",
        "换季感冒了，在家休息了几天。",
        "你学会了一道新菜，家人很喜欢。",
        "路上捡了100块钱，运气不错。",
        "老家亲戚来串门，热闹了一阵子。",
        "你迷上了一部电视剧，追完了全集。"
    ];

    function clamp(v) { return Math.max(0, Math.min(100, v)); }

    function applyEffect(effect) {
        if (!effect) return;
        for (let key in effect) {
            if (player[key] !== undefined) player[key] = clamp(player[key] + effect[key]);
        }
        updateUI();
    }

    function updateUI() {
        document.getElementById('age-display').innerText = `年龄: ${player.age} 岁`;
        document.getElementById('val-int').innerText = player.int;
        document.getElementById('val-str').innerText = player.str;
        document.getElementById('val-mny').innerText = player.mny;
        document.getElementById('val-hap').innerText = player.hap;
        document.getElementById('bar-int').style.width = player.int + '%';
        document.getElementById('bar-str').style.width = player.str + '%';
        document.getElementById('bar-mny').style.width = player.mny + '%';
        document.getElementById('bar-hap').style.width = player.hap + '%';
    }

    function nextYear() {
        if (!player.alive || player.waitingChoice) return;
        player.age++;

        let ev = events.find(e => e.age === player.age);
        if (!ev) {
            ev = { text: randomEvents[Math.floor(Math.random() * randomEvents.length)] };
        }

        document.getElementById('event-card').innerText = ev.text;
        document.getElementById('result-card').style.display = 'none';

        if (ev.effect) applyEffect(ev.effect);

        if (ev.choices) {
            player.waitingChoice = true;
            document.getElementById('next-btn').disabled = true;
            document.getElementById('next-btn').innerText = "请做出选择...";
            const box = document.getElementById('choices-box');
            box.innerHTML = '';
            box.style.display = 'flex';
            ev.choices.forEach((c, idx) => {
                const btn = document.createElement('button');
                btn.className = 'choice-btn';
                btn.innerText = c.text;
                btn.onclick = () => choose(idx, ev.choices);
                box.appendChild(btn);
            });
        } else if (ev.death) {
            player.alive = false;
            setTimeout(showEnding, 600);
        }

        updateUI();
    }

    function choose(idx, choices) {
        const c = choices[idx];
        applyEffect(c.effect);
        document.getElementById('result-card').innerText = c.result;
        document.getElementById('result-card').style.display = 'block';
        document.getElementById('choices-box').style.display = 'none';
        document.getElementById('next-btn').disabled = false;
        document.getElementById('next-btn').innerText = "下一年";
        player.waitingChoice = false;
    }

    function showEnding() {
        document.getElementById('game-page').style.display = 'none';
        document.getElementById('ending-page').style.display = 'block';

        const total = player.int + player.str + player.mny + player.hap;
        let title, desc, icon;
        if (total >= 300) {
            icon = '👑'; title = '传奇人生'; desc = '你的一生精彩纷呈，名利双收，是众人羡慕的对象。';
        } else if (total >= 240) {
            icon = '🌟'; title = '幸福美满'; desc = '你过得充实而快乐，家庭和睦，事业顺遂，令人羡慕。';
        } else if (total >= 180) {
            icon = '🍵'; title = '平平淡淡'; desc = '你没有大富大贵，但也没有大灾大难，这是大多数人的常态。';
        } else if (total >= 120) {
            icon = '🍂'; title = '略带遗憾'; desc = '人生多舛，几次关键选择都不尽如人意，但你依然坚强地走过了这一生。';
        } else {
            icon = '🥀'; title = '遗憾终生'; desc = '命运似乎总在和你开玩笑，一生坎坷，令人唏嘘。';
        }

        document.getElementById('ending-icon').innerText = icon;
        document.getElementById('ending-title').innerText = title;
        document.getElementById('ending-desc').innerText = desc;
        document.getElementById('ending-stats').innerHTML = `
            <div class="ending-score">智力: ${player.int}　体质: ${player.str}　财富: ${player.mny}　快乐: ${player.hap}</div>
            <div class="ending-score">总分: ${total} / 400</div>
        `;
    }

    function resetGame() {
        player = { age: 0, alive: true, int: 50, str: 50, mny: 50, hap: 50, waitingChoice: false };
        document.getElementById('game-page').style.display = 'block';
        document.getElementById('ending-page').style.display = 'none';
        document.getElementById('event-card').innerText = "你出生了，伴随着一声啼哭来到这个世界。";
        document.getElementById('result-card').style.display = 'none';
        document.getElementById('choices-box').style.display = 'none';
        document.getElementById('next-btn').disabled = false;
        document.getElementById('next-btn').innerText = "下一年";
        updateUI();
    }

    updateUI();
</script>

</body>
</html>
